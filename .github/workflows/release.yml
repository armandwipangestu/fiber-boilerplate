name: Release & Deploy

on:
  push:
    branches:
      - staging
      - main

env:
  GHCR_IMAGE: ghcr.io/armandwipangestu/fiber-boilerplate
  DOCKERHUB_IMAGE: devvnull/fiber-boilerplate

jobs:
  # ------------------------------------------------------
  # JOB 1 - BUILD DOCKER IMAGE USING COMMIT SHA (HASH)
  # ------------------------------------------------------
  build-docker-sha:
    name: Build Docker Image Using Commit SHA
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract commit SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GH_USERNAME }}" --password-stdin

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image with SHA tag
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg VERSION=${SHORT_SHA} \
            -f Dockerfile \
            -t $GHCR_IMAGE:${{ env.SHORT_SHA }} \
            -t $DOCKERHUB_IMAGE:${{ env.SHORT_SHA }} .

      - name: Push Docker Image (SHA tag)
        run: |
          docker push $GHCR_IMAGE:${{ env.SHORT_SHA }}
          docker push $DOCKERHUB_IMAGE:${{ env.SHORT_SHA }}

      - name: Save SHA to file
        run: echo "${SHORT_SHA}" > sha.txt

      - name: Upload SHA artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-sha
          path: sha.txt

  # ------------------------------------------------------
  # JOB 2 - SEMANTIC RELEASE
  # ------------------------------------------------------
  release-and-tagging-version:
    name: Release and Tagging Version
    runs-on: ubuntu-latest
    # needs: build-docker-sha
    permissions:
      contents: write
      issues: write
      pull-requests: write
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun for Semantic Release
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Restore Bun Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js 25 for Semantic Release
        uses: actions/setup-node@v6
        with:
          node-version: "25"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: false
        run: npx semantic-release

      - name: Upload version.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: version.txt

  # ------------------------------------------------------
  # JOB 3 - RETAG IMAGE: SHA -> VERSION -> LATEST
  # ------------------------------------------------------
  retag-and-push:
    name: Retag and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-docker-sha
      - release-and-tagging-version
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download version.txt artifact
        uses: actions/download-artifact@v7
        with:
          name: release-version
        continue-on-error: true # Prevents crash if no release happened

      - name: Check if version exists
        id: check-version
        run: |
          if [ -f "version.txt" ]; then
              echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
              echo "RELEASE_EXISTS=true" >> $GITHUB_OUTPUT
          else
              echo "No new version released. Skipping retag."
              echo "RELEASE_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Download sha.txt artifact
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        uses: actions/download-artifact@v7
        with:
          name: built-sha

      - name: Set SHORT_SHA env
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        run: echo "SHORT_SHA=$(cat sha.txt)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        run: echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GH_USERNAME }}" --password-stdin

      - name: Log in to Docker Hub
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Retag and Push
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        run: |
          # Pull from GHCR (using the SHA pushed in Job 1)
          docker pull --platform linux/amd64 $GHCR_IMAGE:${{ env.SHORT_SHA }}

          # Retag and Push to GHCR
          docker tag $GHCR_IMAGE:${{ env.SHORT_SHA }} $GHCR_IMAGE:${{ env.VERSION }}
          docker push $GHCR_IMAGE:${{ env.VERSION }}

          # Retag and Push to Docker Hub
          docker tag $GHCR_IMAGE:${{ env.SHORT_SHA }} $DOCKERHUB_IMAGE:${{ env.VERSION }}
          docker push $DOCKERHUB_IMAGE:${{ env.VERSION }}

      - name: Retag latest (only on main)
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true' && github.ref_name == 'main'
        run: |
          docker tag $GHCR_IMAGE:${{ env.VERSION }} $GHCR_IMAGE:latest
          docker tag $GHCR_IMAGE:${{ env.VERSION }} $DOCKERHUB_IMAGE:latest
          docker push $GHCR_IMAGE:latest
          docker push $DOCKERHUB_IMAGE:latest

  # ------------------------------------------------------
  # JOB 4 - BUILD & ATTACH VERSIONED BINARIES TO THE RELEASE
  # ------------------------------------------------------
  upload-binaries:
    name: Binary ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: release-and-tagging-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: tar.gz
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: tar.gz
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: tar.gz
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: tar.gz
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: zip
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: zip

    steps:
      - name: Download version.txt artifact
        uses: actions/download-artifact@v7
        with:
          name: release-version
        continue-on-error: true # Prevents crash if no release happened

      - name: Check if version exists
        id: check-version
        run: |
          if [ -f "version.txt" ]; then
              echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
              echo "RELEASE_EXISTS=true" >> $GITHUB_OUTPUT
          else
              echo "No new version released. Skipping binary upload."
              echo "RELEASE_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        uses: actions/checkout@v6

      - name: Set up Go
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        run: |
          mkdir -p dist/staging
          LDFLAGS="-s -w -X github.com/armandwipangestu/fiber-boilerplate/internal/pkg.Version=${VERSION}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
              CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
                go build -trimpath -ldflags="${LDFLAGS}" \
                -o dist/staging/fiber-boilerplate.exe ./cmd/app
              ARTIFACT=fiber-boilerplate_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}
              (cd dist/staging && zip -q ../${ARTIFACT} fiber-boilerplate.exe)
          else
              CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
                go build -trimpath -ldflags="${LDFLAGS}" \
                -o dist/staging/fiber-boilerplate ./cmd/app
              ARTIFACT=fiber-boilerplate_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}
              tar -C dist/staging -czf dist/${ARTIFACT} fiber-boilerplate
          fi
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: Checksum and report
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        run: |
          sha256sum dist/${ARTIFACT} | tee dist/${ARTIFACT}.sha256
          echo "### Ready" >> $GITHUB_STEP_SUMMARY
          echo "- \`${ARTIFACT}\`: $(cat dist/${ARTIFACT}.sha256 | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY

      - name: Upload binary to release
        if: steps.check-version.outputs.RELEASE_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" dist/${ARTIFACT} dist/${ARTIFACT}.sha256 --clobber
