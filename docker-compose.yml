# Docker Compose environment for fiber-boilerplate
# Includes Postgres, Redis, and the full observability stack
# (OTel Collector, Tempo, Prometheus, Loki, Alloy, Grafana).
#
# Reference: nestjs-boilerplate docker-compose.yml

services:
  db-fiber-boilerplate:
    image: postgres:17-bookworm
    container_name: db-fiber-boilerplate
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiber_boilerplate
    ports:
      - "5433:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiber_boilerplate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  pgadmin4-fiber-boilerplate:
    image: dpage/pgadmin4:9.10.0
    container_name: pgadmin4-fiber-boilerplate
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    volumes:
      - ./docker-data/pgadmin:/var/lib/pgadmin
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"
    depends_on:
      db-fiber-boilerplate:
        condition: service_healthy

  redis-fiber-boilerplate:
    image: redis:7.4-alpine
    container_name: redis-fiber-boilerplate
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  minio-fiber-boilerplate:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio-fiber-boilerplate
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "minioadmin"
      MINIO_SERVER_URL: http://minio-fiber-boilerplate:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio/data:/data
    command: server /data --address ":9000" --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  otel-collector-fiber-boilerplate:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: otel-collector-fiber-boilerplate
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  tempo-fiber-boilerplate:
    image: grafana/tempo:main-eb21336-amd64
    container_name: tempo-fiber-boilerplate
    restart: unless-stopped
    ports:
      - "3200:3200" # Tempo HTTP
      - "4320:4320" # Tempo gRPC
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo-config.yaml
      - ./docker-data/tempo:/tmp/tempo
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  grafana-fiber-boilerplate:
    image: grafana/grafana:11.4.0
    container_name: grafana-fiber-boilerplate
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3002:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./docker-data/grafana:/var/lib/grafana
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"
    depends_on:
      - tempo-fiber-boilerplate
      - prometheus-fiber-boilerplate
      - loki-fiber-boilerplate

  prometheus-fiber-boilerplate:
    image: prom/prometheus:v2.53.3
    container_name: prometheus-fiber-boilerplate
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./docker-data/prometheus:/prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  loki-fiber-boilerplate:
    image: grafana/loki:3.5.0
    container_name: loki-fiber-boilerplate
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - ./docker-data/loki:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://loki-fiber-boilerplate:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  alloy-fiber-boilerplate:
    image: grafana/alloy:v1.8.3
    container_name: alloy-fiber-boilerplate
    restart: unless-stopped
    ports:
      - "12345:12345"
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy
      - ./docker-data/fiber-boilerplate/logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"
    depends_on:
      loki-fiber-boilerplate:
        condition: service_healthy
