# Taskfile for fiber-boilerplate. Install https://taskfile.dev.
version: "3"

vars:
  DATABASE_URL: postgres://postgres:postgres@localhost:5433/fiber_boilerplate?sslmode=disable
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/fiber_boilerplate_e2e?sslmode=disable
  TEST_REDIS_URL: redis://localhost:6379/15
  SWAG_CLI: swag

tasks:
  default:
    desc: List all tasks
    cmd: task --list

  dev:
    desc: Run the server in development
    cmd: go run ./cmd/app

  build:
    desc: Build the app binary into ./bin
    cmd: go build -trimpath -o bin/app ./cmd/app

  test:
    desc: Run the full unit test suite
    cmd: go test ./cmd/... ./internal/... -count=1

  test-unit:
    desc: Alias for test (unit suite only)
    cmd: go test ./cmd/... ./internal/... -count=1

  test-e2e:
    desc: Run the end-to-end suite against a live database
    env:
      TEST_DATABASE_URL: "{{ .TEST_DATABASE_URL }}"
    cmd: go test ./tests/e2e/... -count=1

  lint:
    desc: Static analysis (go vet)
    cmd: go vet ./cmd/... ./internal/... ./tests/...

  fmt:
    desc: Format all Go sources with gofmt
    cmd: gofmt -l -w ./cmd ./internal ./tests

  migrate-up:
    desc: Apply database migrations
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app migrate up

  migrate-down:
    desc: Revert the last migration
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app migrate down

  migrate-version:
    desc: Show the current migration version
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app migrate version

  migrate-status:
    desc: Show the migration status table
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app migrate status

  migrate-reset:
    desc: Revert all migrations and re-apply them
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app migrate reset --yes

  db-seed:
    desc: Run all database seeders
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app db:seed

  db-fresh:
    desc: Drop the schema, re-migrate and seed
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app db:fresh --yes

  db-seed-admin:
    desc: Seed the default admin user
    env:
      DATABASE_URL: "{{ .DATABASE_URL }}"
    cmd: go run ./cmd/app db:seed admin

  config-check:
    desc: Validate configuration and probe dependencies
    cmd: go run ./cmd/app config:check

  route-list:
    desc: Print the registered routes as JSON
    cmd: go run ./cmd/app route:list --json

  swagger:
    desc: Regenerate OpenAPI (Swagger) docs
    cmd: "{{ .SWAG_CLI }} init -g cmd/app/main.go -o docs/swagger"

  docker-up:
    desc: Build and start the full stack
    cmd: docker compose up -d --build

  docker-down:
    desc: Stop the full stack
    cmd: docker compose down